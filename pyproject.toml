[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medium-mcp"
version = "0.1.1"
description = "MCP server for Medium content via RapidAPI's medium2"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Les Leslie", email = "les@wedgwoodwebworks.com" }]
dependencies = [
    "fastmcp>=2.12.0",
    "httpx2>=0.28.1",
    "mcp-common>=0.18.0",
    "oneiric>=0.16.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.6", "crackerjack>=0.30"]

[project.scripts]
medium-mcp = "medium_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["medium_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "requires_network: hits a real network endpoint",
    "requires_auth: requires MEDIUM_MCP_RAPIDAPI_KEY in env",
    "requires_bpf: requires /dev/bpf* access",
]
addopts = "--cov=medium_mcp --cov-report=term --cov-report=html --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017", "B007", "E741", "F841", "N801", "N802", "N803", "N814", "N818", "SIM116", "SIM117"]

# Pin mcp-common to local dev path so the new auth surface (BearerTokenMiddleware,
# AuthHealth, JWTIdentityProvider, IdentityProvider, etc.) is available. The
# PyPI 0.24.5 wheel predates the auth primitives rewrite; future installs
# require either a release bump or this editable override.
[tool.uv.sources]
mcp-common = { path = "../mcp-common", editable = true }

[dependency-groups]
dev = [
    "crackerjack>=0.80.3",
]
